# Signum Gate — GitHub Actions workflow template
# Runs Signum pipeline as a PR quality gate.
#
# Setup:
#   1. Copy this file to .github/workflows/signum-gate.yml
#   2. Add ANTHROPIC_API_KEY to repository secrets
#   3. Create a contract.json and commit it (or generate per-PR)
#   4. Enable branch protection rule requiring "signum-gate" to pass
#
# Exit codes: 0=AUTO_OK (merge), 1=AUTO_BLOCK (block), 78=HUMAN_REVIEW (manual)

name: Signum Gate

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  signum-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        # pinned from actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Claude CLI
        run: |
          set -euo pipefail
          . lib/tool-versions.env
          case "${CLAUDE_CODE_VERSION:-}" in
            ""|latest|stable)
              echo "ERROR: CLAUDE_CODE_VERSION must be pinned to an explicit version" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$CLAUDE_CODE_VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "ERROR: CLAUDE_CODE_VERSION is not semver-like: $CLAUDE_CODE_VERSION" >&2
            exit 1
          fi
          echo "Installing Claude Code CLI ${CLAUDE_CODE_VERSION}"
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Run Signum
        id: signum
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNUM_CONTRACT_PATH: ${{ github.workspace }}/contract.json
          SIGNUM_PROJECT_ROOT: ${{ github.workspace }}
          SIGNUM_MAX_TURNS: "30"
          SIGNUM_AUDIT_MAX_ITERATIONS: "20"
          # SIGNUM_CI_RELAXED: "true"  # Uncomment to pass HUMAN_REVIEW as success
        run: |
          set +e
          bash lib/signum-ci.sh
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Extract canonical artifact paths and decision for PR comment
          source lib/signum-ci.sh
          INPUT_CONTRACT_ID=$(jq -r '.contractId // empty' "$SIGNUM_CONTRACT_PATH" 2>/dev/null || true)
          ARTIFACT_ROOT=$(resolve_ci_artifact_root "$SIGNUM_PROJECT_ROOT" "$INPUT_CONTRACT_ID" 2>/dev/null || true)
          PROOFPACK_PATH=$(resolve_ci_proofpack_path "$SIGNUM_PROJECT_ROOT" "$INPUT_CONTRACT_ID" 2>/dev/null || true)
          ARTIFACT_UPLOAD_PATH="${ARTIFACT_ROOT:-$SIGNUM_PROJECT_ROOT/.signum/contracts}"
          if [ ! -d "$ARTIFACT_UPLOAD_PATH" ] && [ -d "$SIGNUM_PROJECT_ROOT/.signum" ]; then
            ARTIFACT_UPLOAD_PATH="$SIGNUM_PROJECT_ROOT/.signum"
          fi
          PROOFPACK_UPLOAD_PATH="${PROOFPACK_PATH:-}"
          if [ -z "$PROOFPACK_UPLOAD_PATH" ] && [ -n "$ARTIFACT_ROOT" ]; then
            PROOFPACK_UPLOAD_PATH="$ARTIFACT_ROOT/proofpack.json"
          fi
          if [ -z "$PROOFPACK_UPLOAD_PATH" ]; then
            PROOFPACK_UPLOAD_PATH="$ARTIFACT_UPLOAD_PATH/proofpack.json"
          fi
          echo "artifact_upload_path=$ARTIFACT_UPLOAD_PATH" >> "$GITHUB_OUTPUT"
          echo "proofpack_upload_path=$PROOFPACK_UPLOAD_PATH" >> "$GITHUB_OUTPUT"
          if [ -n "$ARTIFACT_ROOT" ]; then
            echo "artifact_root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PROOFPACK_PATH" ] && [ -f "$PROOFPACK_PATH" ]; then
            DECISION=$(jq -r '.decision' "$PROOFPACK_PATH")
            CONFIDENCE=$(jq -r '.confidence.overall // 0' "$PROOFPACK_PATH")
            RUN_ID=$(jq -r '.runId' "$PROOFPACK_PATH")
            echo "proofpack_path=$PROOFPACK_PATH" >> "$GITHUB_OUTPUT"
            echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
            echo "confidence=$CONFIDENCE" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

          exit $EXIT_CODE

      - name: Upload proofpack
        if: always()
        # pinned from actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signum-proofpack-${{ steps.signum.outputs.run_id || 'unknown' }}
          path: ${{ steps.signum.outputs.proofpack_upload_path }}
          retention-days: 90
          if-no-files-found: warn

      - name: Upload full audit directory
        if: always()
        # pinned from actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signum-audit-${{ steps.signum.outputs.run_id || 'unknown' }}
          path: ${{ steps.signum.outputs.artifact_upload_path }}
          retention-days: 30
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        # pinned from actions/github-script@v7
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const decision = '${{ steps.signum.outputs.decision }}' || 'UNKNOWN';
            const confidence = '${{ steps.signum.outputs.confidence }}' || '?';
            const runId = '${{ steps.signum.outputs.run_id }}' || 'unknown';
            const exitCode = '${{ steps.signum.outputs.exit_code }}' || '?';

            const emoji = {
              'AUTO_OK': ':white_check_mark:',
              'AUTO_BLOCK': ':x:',
              'HUMAN_REVIEW': ':eyes:'
            }[decision] || ':question:';

            const body = [
              `## ${emoji} Signum: ${decision}`,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Decision | **${decision}** |`,
              `| Confidence | ${confidence}% |`,
              `| Run ID | \`${runId}\` |`,
              `| Exit code | ${exitCode} |`,
              '',
              `<details><summary>What do these mean?</summary>`,
              '',
              `- **AUTO_OK** — All checks passed, safe to merge`,
              `- **AUTO_BLOCK** — Issues found, do not merge`,
              `- **HUMAN_REVIEW** — Needs manual review before merging`,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
