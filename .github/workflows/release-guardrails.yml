name: Release Guardrails

on:
  workflow_dispatch:
    inputs:
      emporium_repo:
        description: Emporium repository to inspect
        required: false
        default: heurema/emporium
      emporium_ref:
        description: Emporium git ref to inspect
        required: false
        default: main
      emporium_path:
        description: Marketplace file path inside Emporium
        required: false
        default: .claude-plugin/marketplace.json
      dry_run:
        description: Set to 1 to preview Emporium sync without pushing
        required: false
        default: "0"
  release:
    types:
      - published
  push:
    branches:
      - main
    paths:
      - .claude-plugin/plugin.json
      - README.md
      - CHANGELOG.md
      - docs/RELIABILITY.md
      - .github/workflows/release-guardrails.yml
      - lib/check-emporium-sync.sh
      - lib/release-smoke.sh

permissions:
  contents: read

jobs:
  release-guardrails:
    if: github.repository == 'heurema/signum'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SIGNUM_RELEASE_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      EMPORIUM_REPO: ${{ github.event.inputs.emporium_repo || 'heurema/emporium' }}
      EMPORIUM_GIT_REF: ${{ github.event.inputs.emporium_ref || 'main' }}
      EMPORIUM_PATH: ${{ github.event.inputs.emporium_path || '.claude-plugin/marketplace.json' }}
      EMPORIUM_MARKETPLACE_PATH: ${{ format('{0}/_external/emporium/{1}', github.workspace, github.event.inputs.emporium_path || '.claude-plugin/marketplace.json') }}

    steps:
      - name: Checkout Signum
        # pinned from actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Release preflight
        env:
          EMPORIUM_SSH_KEY: ${{ secrets.EMPORIUM_SSH_KEY }}
        run: |
          set -euo pipefail

          case "${SIGNUM_RELEASE_DRY_RUN:-0}" in
            0|1) ;;
            *)
              echo "ERROR: SIGNUM_RELEASE_DRY_RUN must be 0 or 1." >&2
              exit 1
              ;;
          esac

          if [ -z "${EMPORIUM_REPO:-}" ]; then
            echo "ERROR: EMPORIUM_REPO is required." >&2
            exit 1
          fi
          if [ -z "${EMPORIUM_GIT_REF:-}" ]; then
            echo "ERROR: EMPORIUM_GIT_REF is required." >&2
            exit 1
          fi
          if [ -z "${EMPORIUM_PATH:-}" ]; then
            echo "ERROR: EMPORIUM_PATH is required." >&2
            exit 1
          fi
          if [ ! -f ".claude-plugin/plugin.json" ]; then
            echo "ERROR: missing source metadata file: .claude-plugin/plugin.json" >&2
            exit 1
          fi
          if [ ! -f "lib/update-emporium-marketplace.sh" ]; then
            echo "ERROR: missing sync helper: lib/update-emporium-marketplace.sh" >&2
            exit 1
          fi
          if [ ! -f "lib/release-smoke.sh" ]; then
            echo "ERROR: missing release smoke helper: lib/release-smoke.sh" >&2
            exit 1
          fi
          if [ "$SIGNUM_RELEASE_DRY_RUN" != "1" ] && [ -z "${EMPORIUM_SSH_KEY:-}" ]; then
            echo "ERROR: EMPORIUM_SSH_KEY secret is required when SIGNUM_RELEASE_DRY_RUN is not 1." >&2
            exit 1
          fi

          if [ "$SIGNUM_RELEASE_DRY_RUN" = "1" ]; then
            DRY_RUN_LABEL="enabled"
          else
            DRY_RUN_LABEL="disabled"
          fi

          echo "Release preflight:"
          echo "  dry-run: ${DRY_RUN_LABEL}"
          echo "  target repo: ${EMPORIUM_REPO}"
          echo "  target ref: ${EMPORIUM_GIT_REF}"
          echo "  target marketplace path: ${EMPORIUM_PATH}"
          echo "  source metadata: .claude-plugin/plugin.json"
          echo "  sync helper: lib/update-emporium-marketplace.sh"

      - name: Checkout Emporium registry (dry run)
        if: ${{ env.SIGNUM_RELEASE_DRY_RUN == '1' }}
        # pinned from actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ env.EMPORIUM_REPO }}
          ref: ${{ env.EMPORIUM_GIT_REF }}
          path: _external/emporium
          persist-credentials: false

      - name: Checkout Emporium registry (write)
        if: ${{ env.SIGNUM_RELEASE_DRY_RUN != '1' }}
        # pinned from actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ env.EMPORIUM_REPO }}
          ref: ${{ env.EMPORIUM_GIT_REF }}
          path: _external/emporium
          ssh-key: ${{ secrets.EMPORIUM_SSH_KEY }}
          persist-credentials: true

      - name: Sync Emporium marketplace entry
        run: |
          set -euo pipefail

          if [ ! -f "$EMPORIUM_MARKETPLACE_PATH" ]; then
            echo "ERROR: Emporium marketplace file not found after checkout: $EMPORIUM_MARKETPLACE_PATH" >&2
            exit 1
          fi

          bash lib/update-emporium-marketplace.sh

          if git -C _external/emporium diff --quiet -- "${EMPORIUM_PATH}"; then
            echo "Emporium marketplace already in sync."
            exit 0
          fi

          echo "Emporium marketplace changes prepared:"
          git -C _external/emporium status --short -- "${EMPORIUM_PATH}"
          git -C _external/emporium diff --stat -- "${EMPORIUM_PATH}"

          if [ "${SIGNUM_RELEASE_DRY_RUN:-0}" = "1" ]; then
            echo "SIGNUM_RELEASE_DRY_RUN=1; skipping Emporium commit and git push."
            exit 0
          fi

          LOCAL_VERSION="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
          if [ -z "$LOCAL_VERSION" ] || [ "$LOCAL_VERSION" = "null" ]; then
            echo "ERROR: missing local version in .claude-plugin/plugin.json" >&2
            exit 1
          fi

          git -C _external/emporium config user.name "github-actions[bot]"
          git -C _external/emporium config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _external/emporium add "${EMPORIUM_PATH}"
          git -C _external/emporium commit -m "Sync Signum marketplace version to ${LOCAL_VERSION}"
          git -C _external/emporium remote set-url origin "git@github.com:${EMPORIUM_REPO}.git"
          git -C _external/emporium push origin "HEAD:${EMPORIUM_GIT_REF}"

      - name: Run release smoke path
        env:
          EMPORIUM_REPO: ${{ github.event.inputs.emporium_repo || 'heurema/emporium' }}
          EMPORIUM_GIT_REF: ${{ github.event.inputs.emporium_ref || 'main' }}
          EMPORIUM_PATH: ${{ github.event.inputs.emporium_path || '.claude-plugin/marketplace.json' }}
          EMPORIUM_MARKETPLACE_PATH: ${{ format('{0}/_external/emporium/{1}', github.workspace, github.event.inputs.emporium_path || '.claude-plugin/marketplace.json') }}
        run: bash lib/release-smoke.sh
