name: Doc Parity

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  doc-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        # pinned from actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run doc parity check
        run: |
          bash lib/doc-parity-check.sh > doc-parity.json
          cat doc-parity.json

      - name: Emit warnings
        run: |
          COUNT=$(jq '.findings | length' doc-parity.json)
          echo "doc_parity_findings=$COUNT" >> "$GITHUB_ENV"
          jq -r '.findings[] | "::warning file=\(.file)::[\(.code)] \(.message) -- \(.details)"' doc-parity.json || true

      - name: Add summary
        run: |
          {
            echo "## Doc Parity"
            echo
            echo "- Status: \`$(jq -r '.status' doc-parity.json)\`"
            echo "- Summary: $(jq -r '.summary' doc-parity.json)"
            echo
            echo "### Findings"
            jq -r '.findings[] | "- [\(.code)] \(.file): \(.message) — \(.details)"' doc-parity.json || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run doc parity unit tests
        run: bash tests/test-doc-parity.sh
